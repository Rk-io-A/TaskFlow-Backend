version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskflow
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build:
      context: .
      dockerfile: src/TaskFlow.API/Dockerfile
    ports: ["5000:8080"]
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=taskflow;Username=postgres;Password=postgres
      ConnectionStrings__Redis: redis:6379
      Jwt__Key: TaskFlowSuperSecretKeyThatIsAtLeast32CharactersLong!
      Jwt__Issuer: TaskFlow
      Jwt__Audience: TaskFlowApp
    depends_on: [postgres, redis]
